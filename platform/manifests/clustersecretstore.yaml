# Shared, cluster-scoped ClusterSecretStore — the ESO source every ExternalSecret references.
# NO auth/serviceAccountRef block: ESO authenticates as its own SA via Pod Identity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
